[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-triage-cn"
version = "0.1.0"
description = "A non-official Chinese text triage tool for TypeSafe Jev"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
jevtriage = "jevtriage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
